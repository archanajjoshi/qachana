name: Pytest-BDD in Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t pytest_demo:latest ./pytest_demo/pytest_bdd_demo

      - name: Run tests inside docker container
        run: docker run pytest_demo:latest
