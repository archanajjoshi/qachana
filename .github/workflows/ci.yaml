name: Pytest-BDD in Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker-compose
        run: docker-compose -f ./pytest_demo/docker-compose.yml build

      - name: Run tests with docker-compose
        run: docker-compose -f ./pytest_demo/docker-compose.yml up --abort-on-container-exit --build
