services:
  pytest_bdd:
    build:
      context: ./pytest_bdd_demo
      dockerfile: Dockerfile
    container_name: pytest_bdd_demo_container
    ports:
      - "5000:5000"
    volumes:
      - ./pytest_bdd_demo:/app
    command: pytest -v

  playwright_tests:
    build:
      context: ./playwright_tests
      dockerfile: Dockerfile
    container_name: playwright_tests_container
    ports:
      - "8080:8080"
    volumes:
      - ./playwright_tests:/tests
    command: pytest -v

  pytest_api:
    build:
      context: ./pytest_api
      dockerfile: Dockerfile
    container_name: pytest_api_container
    ports:
      - "3000:3000"
    volumes:
      - ./pytest_api:/app
    command: pytest -v